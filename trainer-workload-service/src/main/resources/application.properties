spring.application.name=trainer-workload-service
server.port=8081

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/trainer_workload}
spring.data.mongodb.auto-index-creation=true

security.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-value-at-least-32-bytes}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [txId=%X{transactionId}] %-5level %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
