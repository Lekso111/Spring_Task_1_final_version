spring.application.name=trainer-workload-service
server.port=8081

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

security.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-value-at-least-32-bytes}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [txId=%X{transactionId}] %-5level %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
